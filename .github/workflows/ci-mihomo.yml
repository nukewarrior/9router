name: Mihomo CI

on:
  push:
    branches:
      - codex/mihomo-smart-routing
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mihomo-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  mihomo-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node22-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Bootstrap Vitest
        run: npm install --no-save --no-audit --no-fund vitest

      - name: Print environment versions
        run: |
          node --version
          npm --version
          npx vitest --version

      - name: Run Mihomo tests
        run: |
          set -o pipefail
          npm run ci:test:mihomo 2>&1 | tee mihomo-tests.log

      - name: Upload Mihomo test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mihomo-tests-log
          path: mihomo-tests.log
          if-no-files-found: ignore
          retention-days: 7
