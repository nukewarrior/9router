name: Full CI

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: full-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  VITEST_VERSION: "4.1.10"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node22-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install pinned Vitest
        run: npm install --no-save --no-audit --no-fund "vitest@${VITEST_VERSION}"

      - name: Print environment versions
        run: |
          node --version
          npm --version
          npx vitest --version

      - name: Check test quarantine registry
        run: node scripts/check-test-quarantine.mjs

      - name: Run Stable Unit tests
        run: |
          set -o pipefail
          npm run ci:test:unit 2>&1 | tee stable-unit-tests.log

      - name: Upload Stable Unit test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stable-unit-tests-log
          path: stable-unit-tests.log
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs:
      - unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node22-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Print environment versions
        run: |
          node --version
          npm --version

      - name: Build production bundle
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
