name: Build and Push GHCR Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional image tag, e.g. 0.6.0-mihomo"
        required: false
        type: string
      latest:
        description: "Also update latest tag"
        required: true
        default: true
        type: boolean

concurrency:
  group: docker-publish-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}-${{ inputs.tag }}-${{ inputs.latest }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/nukewarrior/9router

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate custom image tag
        id: validate_tag
        shell: bash
        env:
          CUSTOM_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ -z "${CUSTOM_TAG}" ]]; then
            {
              echo "has_custom_tag=false"
              echo "custom_tag=unused"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${CUSTOM_TAG}" == "latest" ]]; then
            echo "::error::The 'latest' tag is reserved. Use the 'latest' workflow input instead."
            exit 1
          fi

          if [[ ! "${CUSTOM_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid image tag. Use 1-128 characters matching [A-Za-z0-9_][A-Za-z0-9_.-]*."
            exit 1
          fi

          {
            echo "has_custom_tag=true"
            echo "custom_tag=${CUSTOM_TAG}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ inputs.latest == true }}
            type=raw,value=${{ steps.validate_tag.outputs.custom_tag }},enable=${{ steps.validate_tag.outputs.has_custom_tag == 'true' }}
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
